# Dependency list for https://github.com/rapidsai/dependency-file-generator
files:
  all:
    output: none
    includes:
      - build
      - checks
      - py_version
      - run
      - test
  checks:
    output: none
    includes:
      - checks
      - py_version
  build:
    output: pyproject
    pyproject_dir: .
    extras:
      table: build-system
    includes:
      - build
  run:
    output: pyproject
    pyproject_dir: .
    extras:
      table: project
    includes:
      - run
  test_extras:
    output: pyproject
    pyproject_dir: .
    extras:
      table: project.optional-dependencies
      key: test
    includes:
      - test
channels:
  - rapidsai
  - rapidsai-nightly
  - conda-forge
dependencies:
  build:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:
          - setuptools>=77.0.0
  checks:
    common:
      - output_types: [conda, requirements]
        packages:
          - identify>=2.6.13
          - pre-commit
  py_version:
    specific:
      - output_types: conda
        matrices:
          - matrix:
              py: "3.12"
            packages:
              - python=3.12
          - matrix:
              py: "3.13"
            packages:
              - python=3.13
          - matrix:
              py: "3.14"
            packages:
              - python=3.14
          - matrix:
            packages:
              - python>=3.12,<3.15
  run:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:
          - PyYAML
          - packaging
          - rapids-dependency-file-generator>=1.13.3,<2.0.dev0
          - tomlkit
  test:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:
          - jinja2
          - pytest
